<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beari mascot rig</title>
<style>
:root{--bg:#FAF9F6;--surface:#FFFFFF;--text:#141B28;--accent:#1D3D9B;--muted:#5b6478;--line:rgba(20,27,40,.12);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E0F16;--surface:#14151F;--text:#E9EBF1;--accent:#6F9AF8;--muted:#9aa2b5;--line:rgba(233,235,241,.14)}}
:root[data-theme="dark"]{--bg:#0E0F16;--surface:#14151F;--text:#E9EBF1;--accent:#6F9AF8;--muted:#9aa2b5;--line:rgba(233,235,241,.14)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Satoshi,"Cabinet Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
main{max-width:1000px;margin:0 auto;padding:28px 20px 56px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:22px;margin:0;letter-spacing:-.01em}
p{margin:0;color:var(--muted);font-size:14px}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.theme{background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px}
.hero{display:grid;grid-template-columns:minmax(200px,300px) 1fr;gap:28px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:0 8px 28px rgba(20,27,40,.06)}
#hero{width:100%;aspect-ratio:1;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .chip[aria-pressed="true"]{color:#0E0F16}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#0E0F16}}
.sheet{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 24px;margin:36px auto 0;max-width:720px}
.sheet div{aspect-ratio:1}
.sizes{display:flex;gap:28px;align-items:flex-end;justify-content:center;margin-top:32px}
svg{display:block;width:100%;height:100%;overflow:visible}
@media (max-width:640px){.hero{grid-template-columns:1fr;padding:20px}#hero{max-width:260px;margin:0 auto}}
</style>
</head>
<body>
<main>
<header><h1>Beari</h1><button class="theme" id="theme" type="button">Switch theme</button></header>
<section class="hero">
  <div id="hero" aria-label="Beari mascot"></div>
  <div>
    <p>Hover the bear to see it turn toward your pointer. Each button sets one assistant state; transitions are interpolated, and one-shot states return to idle on their own.</p>
    <div class="chips" id="chips"></div>
  </div>
</section>
<section class="sheet" id="sheet" aria-label="Expression sheet"></section>
<section class="sizes" id="sizes" aria-label="Small sizes"></section>
</main>
<script>
const SVG=`<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Beari"><g data-r="rig">
<g data-r="eL"><circle cx="50" cy="62" r="30" fill="#1D3D9B" stroke="#6F9AF8" stroke-opacity=".5" stroke-width="2.5"/><circle cx="53" cy="66" r="17" fill="#FAF9F6"/></g>
<g data-r="eR"><circle cx="190" cy="62" r="30" fill="#1D3D9B" stroke="#6F9AF8" stroke-opacity=".5" stroke-width="2.5"/><circle cx="187" cy="66" r="17" fill="#FAF9F6"/></g>
<path d="M120 44C150 44 172 52 188 66C206 82 214 106 216 128C217 170 190 210 120 214C50 210 23 170 24 128C26 106 34 82 52 66C68 52 90 44 120 44Z" fill="#1D3D9B" stroke="#6F9AF8" stroke-opacity=".5" stroke-width="2.5"/>
<path d="M110 47C114 36 122 31 134 31C130 37 128 42 129 47Z M24 136L13 154L30 150Z M216 136L227 154L210 150Z" fill="#1D3D9B"/>
<g data-r="chk" fill="#6F9AF8"><ellipse cx="58" cy="148" rx="11" ry="6.5"/><ellipse cx="182" cy="148" rx="11" ry="6.5"/></g>
<path d="M120 140C146 140 170 156 172 178C172 198 148 205 120 205C92 205 68 198 68 178C70 156 94 140 120 140Z" fill="#FAF9F6"/>
<path d="M104 151C104 143 112 140 120 140C128 140 136 143 136 151C136 158 128 162 120 168C112 162 104 158 104 151Z" fill="#141B28"/>
<ellipse cx="114" cy="147" rx="7" ry="2.4" fill="#FAF9F6" opacity=".75" transform="rotate(-10 114 147)"/>
<path data-r="mo" fill="#141B28" fill-opacity="0"/>
<ellipse data-r="tg" fill="#6F9AF8" opacity="0"/>
<path data-r="sm" fill="none" stroke="#141B28" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M120 167V178" stroke="#141B28" stroke-width="4.5" stroke-linecap="round"/>
<g data-r="yL"><ellipse cx="86" cy="112" rx="17" ry="15" fill="#FAF9F6"/><g data-r="pL"><circle cx="86" cy="112" r="9.5" fill="#141B28"/><circle cx="89" cy="108.5" r="3" fill="#fff"/></g></g>
<g data-r="yR"><ellipse cx="154" cy="112" rx="17" ry="15" fill="#FAF9F6"/><g data-r="pR"><circle cx="154" cy="112" r="9.5" fill="#141B28"/><circle cx="157" cy="108.5" r="3" fill="#fff"/></g></g>
<g fill="none" stroke="#FAF9F6" stroke-width="5.5" stroke-linecap="round"><path data-r="hL" d="M70 117Q86 101 102 117" opacity="0"/><path data-r="hR" d="M138 117Q154 101 170 117" opacity="0"/><path data-r="sL" d="M70 111Q86 124 102 111" opacity="0"/><path data-r="sR" d="M138 111Q154 124 170 111" opacity="0"/></g>
<path data-r="bL" d="M68 94Q84 76 103 86Q86 82 68 94Z" fill="#FAF9F6" stroke="#FAF9F6" stroke-width="2" stroke-linejoin="round"/>
<path data-r="bR" d="M172 94Q156 76 137 86Q154 82 172 94Z" fill="#FAF9F6" stroke="#FAF9F6" stroke-width="2" stroke-linejoin="round"/>
</g>
<g data-r="z" opacity="0" fill="none" stroke="#6F9AF8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path data-r="z1" d="M0 0H10L0 12H10"/><path data-r="z2" d="M0 0H10L0 12H10"/></g>
</svg>`;
const REFS="rig eL eR chk mo tg sm yL yR pL pR hL hR sL sR bL bR z z1 z2".split(" ");
const B={rot:0,x:0,y:0,sc:1,lx:0,ly:0,eo:1,hap:0,slp:0,bLy:0,bLr:0,bRy:0,bRr:0,w:24,lift:7,d:9,skew:0,open:0,chk:.18,eL:0,eR:0,z:0};
const P={
 idle:{},
 welcome:{w:27,lift:11,d:12,bLy:-3,bRy:-3,chk:.4},
 curious:{rot:-6,lx:4,ly:1,bLy:-4,bRy:-5,bLr:-3,bRr:3,w:22,lift:6,chk:.25,eL:-5,eR:6},
 listening:{y:2,sc:1.03,eo:1.1,ly:1,bLy:-3,bRy:-3,w:17,lift:3,d:5,chk:.2},
 thinking:{rot:5,lx:-5,ly:-4,eo:.92,bLy:1,bLr:6,bRy:-6,bRr:-6,w:11,lift:0,d:2,skew:1},
 happy:{rot:-3,hap:1,bLy:-3,bRy:-3,w:30,lift:12,d:14,open:.4,chk:.5,eL:-5,eR:5},
 speaking:{w:20,lift:4,d:6,open:.6,bLy:-1,bRy:-1},
 confused:{rot:9,lx:4,ly:-1,eo:.95,bLy:-8,bLr:-8,bRy:2,bRr:7,w:13,lift:0,d:2,skew:3},
 apologetic:{rot:-3,y:3,ly:2,eo:.85,bLy:2,bLr:-13,bRy:2,bRr:13,w:14,lift:-4,d:-7,chk:0},
 sleeping:{rot:6,y:4,slp:1,bLy:3,bRy:3,w:14,lift:4,d:5,z:1,chk:.3}
};
const RM=matchMedia("(prefers-reduced-motion: reduce)");
const live=new Set(), cl=(v,a,b)=>Math.max(a,Math.min(b,v));
class Beari{
 constructor(host,{state="idle",animate=true}={}){
  host.innerHTML=SVG; this.q={};
  for(const k of REFS) this.q[k]=host.querySelector(`[data-r="${k}"]`);
  this.s=state; this.hov=false; this.g=null; this.by=0; this.bv=0; this.wig=0; this.ret=0;
  this.t=Math.random()*10; this.nb=this.t+2+Math.random()*3; this.bp=-1; this.ng=this.t+2; this.jx=0; this.jy=0;
  this.animate=animate; this.aim(); this.cur={...this.tgt}; this.step(0);
  if(animate) live.add(this);
 }
 aim(){
  const e=this.hov&&this.s==="idle"?"curious":this.s, t={...B,...P[e]};
  if(this.g&&(e==="curious"||e==="listening")){t.lx=this.g.x;t.ly=this.g.y}
  this.tgt=t;
 }
 set(s,back,after=1800){
  clearTimeout(this.ret); this.s=s; this.aim();
  if(back) this.ret=setTimeout(()=>this.set("idle"),after);
 }
 react(s,after){ this.set(s,true,after); if(s==="happy"||s==="welcome") this.bounce(s==="happy"?1:0) }
 bounce(w=0){ if(!RM.matches){this.bv=-85;this.wig=w} }
 step(dt){
  const rm=RM.matches||!this.animate, t=(this.t+=dt), c=this.cur, T=this.tgt, k=rm?1:1-Math.exp(-dt*9), q=this.q;
  if(dt>0) for(const key in T) c[key]+=(T[key]-c[key])*k;
  let y=c.y, rot=c.rot, lx=c.lx, ly=c.ly, open=c.open, bl=1;
  if(!rm){
   y+=Math.sin(t*(c.slp>.5?1:1.7))*(c.slp>.5?1.8:1);
   this.bv+=(-260*this.by-14*this.bv)*dt; this.by+=this.bv*dt; y+=this.by;
   if((this.s==="idle"&&!this.hov)||this.s==="welcome"){
    if(t>this.ng){this.jx=(Math.random()-.5)*5;this.jy=(Math.random()-.6)*3;this.ng=t+2+Math.random()*3}
    lx+=this.jx; ly+=this.jy;
   }
   if(this.s==="speaking"){
    open=T.open*(.25+.75*Math.abs(Math.sin(t*7.3)*.6+Math.sin(t*11.7+1)*.4));
    rot+=Math.sin(t*2.2)*1.4; y+=Math.sin(t*4.4)*.8;
   }
   if(this.s==="thinking"){rot+=Math.sin(t*1.4)*1.2; lx+=Math.sin(t*1.1)*1.5}
   if(this.bp<0&&t>this.nb) this.bp=0;
   if(this.bp>=0){
    this.bp+=dt/.17; bl=1-Math.sin(Math.PI*Math.min(1,this.bp));
    if(this.bp>=1){this.bp=-1;this.nb=t+2.2+Math.random()*3.8; if(Math.random()<.2)this.nb=t+.35}
   }
  } else if(this.s==="speaking") open=T.open*.5;
  const A=(el,n,v)=>el.setAttribute(n,v), w=c.wig, wg=Math.sin(t*20)*this.wig*7;
  this.wig*=Math.exp(-dt*3);
  A(q.rig,"transform",`translate(${c.x} ${y}) rotate(${rot} 120 200) translate(120 150) scale(${c.sc}) translate(-120 -150)`);
  A(q.eL,"transform",`rotate(${c.eL+wg} 50 84)`); A(q.eR,"transform",`rotate(${c.eR-wg} 190 84)`);
  A(q.bL,"transform",`translate(0 ${c.bLy}) rotate(${c.bLr} 86 88)`); A(q.bR,"transform",`translate(0 ${c.bRy}) rotate(${c.bRr} 154 88)`);
  const es=Math.max(.06,c.eo*bl), eop=1-Math.max(c.hap,c.slp);
  for(const [s,cx] of [["L",86],["R",154]]){
   A(q["y"+s],"transform",`translate(${cx} 112) scale(1 ${es}) translate(${-cx} -112)`); A(q["y"+s],"opacity",eop);
   A(q["p"+s],"transform",`translate(${cl(lx,-6,6)} ${cl(ly,-4,4)})`);
   A(q["h"+s],"opacity",c.hap); A(q["s"+s],"opacity",c.slp);
  }
  A(q.chk,"opacity",c.chk);
  const W=c.w, yL=178-c.lift, yR=yL-c.skew, a=`M${120-W} ${yL}Q${120-W*.5} ${178+c.d} 120 178Q${120+W*.5} ${178+c.d} ${120+W} ${yR}`;
  A(q.sm,"d",a);
  A(q.mo,"d",`${a}Q120 ${178+open*34+Math.max(0,c.d)*.5} ${120-W} ${yL}Z`); A(q.mo,"fill-opacity",Math.min(1,open*8));
  A(q.tg,"cx",120); A(q.tg,"cy",180+open*9.5); A(q.tg,"rx",W*.4); A(q.tg,"ry",open*3); A(q.tg,"opacity",open>.25?1:0);
  A(q.z,"opacity",c.z>.01?1:0);
  if(c.z>.01) [[q.z1,0],[q.z2,.5]].forEach(([el,o])=>{const p=(t*.35+o)%1; A(el,"transform",`translate(${204+p*14} ${34-p*22}) scale(${.7+p*.6})`); A(el,"opacity",Math.sin(Math.PI*p)*c.z)});
 }
}
let last=performance.now();
(function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;if(!document.hidden)live.forEach(b=>b.step(dt));requestAnimationFrame(loop)})(last);

// Hero + controls
const heroEl=document.getElementById("hero"), hero=new Beari(heroEl);
heroEl.addEventListener("pointerenter",()=>{hero.hov=true;hero.aim()});
heroEl.addEventListener("pointerleave",()=>{hero.hov=false;hero.g=null;hero.aim()});
heroEl.addEventListener("pointermove",e=>{
 const r=heroEl.getBoundingClientRect();
 hero.g={x:cl((e.clientX-r.left-r.width/2)/(r.width/2),-1,1)*5.5,y:cl((e.clientY-r.top-r.height/2)/(r.height/2),-1,1)*3.5}; hero.aim();
});
const acts=[["Idle",()=>hero.set("idle")],["Chat opened",()=>hero.react("welcome",1600)],["User typing",()=>hero.set("listening")],["Processing",()=>hero.set("thinking")],["Responding",()=>hero.set("speaking")],["Success",()=>hero.react("happy",2200)],["Error",()=>hero.set("apologetic")],["Confused",()=>hero.set("confused")],["Sleeping",()=>hero.set("sleeping")],["Chat closed",()=>hero.set("idle")]];
const chips=document.getElementById("chips");
acts.forEach(([l,f])=>{
 const b=document.createElement("button"); b.className="chip"; b.type="button"; b.textContent=l; b.setAttribute("aria-pressed","false");
 b.onclick=()=>{chips.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed","false"));b.setAttribute("aria-pressed","true");f()};
 chips.appendChild(b);
});
chips.firstChild.setAttribute("aria-pressed","true");

// Expression sheet (live, one shared loop)
const sheet=document.getElementById("sheet");
["idle","curious","listening","thinking","happy","speaking","confused","apologetic","sleeping"].forEach(s=>{
 const d=document.createElement("div"); sheet.appendChild(d); new Beari(d,{state:s});
});
// Small-size check
const sizes=document.getElementById("sizes");
[64,56,48,32].forEach(px=>{const d=document.createElement("div");d.style.cssText=`width:${px}px;height:${px}px`;sizes.appendChild(d);new Beari(d,{animate:false})});

document.getElementById("theme").onclick=()=>{
 const r=document.documentElement, dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
 r.dataset.theme=dark?"light":"dark";
};
</script>
</body>
</html>
